<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VL SmartLive four edition preview board</title>
    <style>
      :root{color-scheme:dark;--bg:#050a10;--panel:#111b25;--line:#263746;--text:#edf6ff;--muted:#a7b7c7;--green:#35e75d;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 30% 0,#14283a,#050a10 46%,#030507);color:var(--text)}header{position:sticky;top:0;z-index:10;background:rgba(5,10,16,.9);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:22px;margin:0}.meta{color:var(--muted);font-size:13px}.grid{padding:18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.frame-card{background:linear-gradient(180deg,rgba(21,33,45,.95),rgba(10,17,25,.95));border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.35)}.frame-head{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--line)}.frame-head strong{font-size:14px}.badge{font-size:12px;color:#07130c;background:var(--green);border-radius:999px;padding:5px 9px;font-weight:800}.frame-wrap{height:720px;background:#071019}.mobile .frame-wrap{height:920px}.obs .frame-wrap{height:820px}iframe{width:100%;height:100%;border:0;background:#071019}.links{display:flex;gap:10px;flex-wrap:wrap}.links a{color:#d8ffe0;border:1px solid #2e6c3f;text-decoration:none;border-radius:999px;padding:8px 11px;font-size:13px}@media(max-width:1100px){.grid{grid-template-columns:1fr}.frame-wrap,.mobile .frame-wrap,.obs .frame-wrap{height:760px}}@media(max-width:620px){header{display:grid}.grid{padding:10px}.frame-wrap,.mobile .frame-wrap,.obs .frame-wrap{height:680px}}
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>VL SmartLive four edition preview board</h1>
        <div class="meta">One-page visual check for Web Console, PC Standalone, Mobile Web, and OBS Bridge.</div>
      </div>
      <nav class="links">
        <a href="../apps/console/index.html" target="_blank" rel="noopener">Open Web Console</a>
        <a href="../apps/pc-standalone/index.html" target="_blank" rel="noopener">Open PC</a>
        <a href="../apps/mobile/index.html" target="_blank" rel="noopener">Open Mobile</a>
        <a href="../apps/obs-bridge/index.html" target="_blank" rel="noopener">Open OBS Bridge</a>
      </nav>
    </header>
    <main class="grid">
      <section class="frame-card web"><div class="frame-head"><strong>Web Console</strong><span class="badge">web</span></div><div class="frame-wrap"><iframe src="../apps/console/index.html" title="Web Console"></iframe></div></section>
      <section class="frame-card pc"><div class="frame-head"><strong>PC Standalone</strong><span class="badge">pc</span></div><div class="frame-wrap"><iframe src="../apps/pc-standalone/index.html" title="PC Standalone"></iframe></div></section>
      <section class="frame-card mobile"><div class="frame-head"><strong>Mobile Web</strong><span class="badge">mobile</span></div><div class="frame-wrap"><iframe src="../apps/mobile/index.html" title="Mobile Web"></iframe></div></section>
      <section class="frame-card obs"><div class="frame-head"><strong>OBS Bridge</strong><span class="badge">obs</span></div><div class="frame-wrap"><iframe src="../apps/obs-bridge/index.html" title="OBS Bridge"></iframe></div></section>
    </main>
  </body>
</html>
