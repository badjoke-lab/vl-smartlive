name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: corepack prepare pnpm@9.12.3 --activate
      - run: pnpm --version
      - run: pnpm install --lockfile-only
      - run: pnpm run public-surface:check
      - run: pnpm run release:direct
      - run: pnpm run direct-release:check
      - run: pnpm run release:direct:zips
      - run: test -f dist/direct-release/obs-bridge/start-macos.command
      - run: test -f dist/direct-release/web-console/start-macos.command
      - run: test -f dist/direct-release/pc-standalone/start-macos.command
      - run: test -f dist/direct-release/mobile/start-macos.command
      - run: test -f dist/direct-release/obs-bridge.zip
      - run: test -f dist/direct-release/web-console.zip
      - run: test -f dist/direct-release/pc-standalone.zip
      - run: test -f dist/direct-release/mobile.zip
      - run: test -f dist/direct-release/SHA256SUMS.txt
